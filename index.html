<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Konfirmasi Penerimaan Uniform - Seahaven Villas</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-color: #1a3636;
            --secondary-color: #40534c;
            --accent-color: #d6bd98;
            --bg-color: #f7f9f8;
            --card-bg: #ffffff;
            --text-color: #2c3e50;
            --border-radius: 12px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Montserrat', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px 10px;
        }

        .container {
            width: 100%;
            max-width: 750px;
            background: var(--card-bg);
            border-radius: var(--border-radius);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            overflow: hidden;
            border: 1px solid rgba(0,0,0,0.05);
        }

        .header {
            background-color: var(--primary-color);
            color: #ffffff;
            padding: 25px 20px;
            text-align: center;
        }

        .header h1 {
            font-family: 'Cinzel', serif;
            font-size: 1.6rem;
            letter-spacing: 2px;
            margin-bottom: 8px;
            color: var(--accent-color);
        }

        .header p {
            font-size: 0.9rem;
            opacity: 0.85;
            font-weight: 300;
        }

        .iframe-container {
            width: 100%;
            height: 850px;
            border: none;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>FORM UNIFORM</h1>
            <p>Konfirmasi Fitting & Penerimaan Seragam Karyawan</p>
        </div>

        <div class="iframe-container">
            <iframe src="https://docs.google.com/forms/d/e/1FAIpQLSfSDyFATkJ-x4uZT4lTWcdAVqcQQ7Xst8si91Q9NqClfkEXZw/viewform?embedded=true">Memuat form...</iframe>
        </div>
    </div>

</body>
</html>
